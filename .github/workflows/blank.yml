name: Update README stats

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README
        run: |
          python <<'PY'
          import sqlite3
          from pathlib import Path

          # Count existing levels
          conn = sqlite3.connect("levels.db")
          cur = conn.cursor()
          cur.execute("SELECT COUNT(*) FROM levels")
          exists = cur.fetchone()[0]
          conn.close()

          # Count scanned levels (number of set bits)
          total = 0
          with open("bitmap.bin", "rb") as f:
              while chunk := f.read(1024 * 1024):
                  total += sum(byte.bit_count() for byte in chunk)

          Path("README.md").write_text(
              f"""# gdump

          gdump is massive scan of geometry dash levels

          **Total scanned:** {total:,}

          **Exists:** {exists:,}

          `bitmap.bin` — all scanned levels (including non-existent ones)

          `levels.db` — metadata of existing levels, format sqlite
          """.replace("          ", ""),
              encoding="utf-8",
          )
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing changed"
            exit 0
          fi

          git config user.name "gdscanner"
          git config user.email "gdscan92@gmail.com"

          git add README.md
          git commit -m "Update README statistics"
          git push
